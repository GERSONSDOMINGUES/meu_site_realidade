<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Giroscópio Correção</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            pointer-events: auto;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            color: #ffffff;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            max-width: 80%;
            pointer-events: auto;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 10px;
        }
    </style>
    <!-- Carregando Three.js de um CDN robusto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <button id="btn-sensor">ATIVAR SENSOR DE MOVIMENTO</button>
        <div id="status">Aguardando ativação (Acesse via HTTPS no celular)</div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DO THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Criando o cubo 3D com bordas visíveis
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshNormalMaterial();
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Adicionando linhas de contorno para melhorar a percepção 3D
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
        cube.add(line);

        // Variáveis para armazenar a rotação alvo (suavização)
        let targetX = 0;
        let targetY = 0;

        // Loop de renderização
        function animate() {
            requestAnimationFrame(animate);
            
            // Suaviza o movimento aplicando interpolação linear (LERP)
            cube.rotation.x += (targetX - cube.rotation.x) * 0.1;
            cube.rotation.y += (targetY - cube.rotation.y) * 0.1;
            
            renderer.render(scene, camera);
        }
        animate();

        // Ajusta o tamanho da tela se o celular girar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- TRATAMENTO DO SENSOR (ORIENTAÇÃO DO DISPOSITIVO) ---
        const btn = document.getElementById('btn-sensor');
        const statusDiv = document.getElementById('status');

        function handleOrientation(event) {
            // Obtém os ângulos em graus e converte para radianos
            // beta: movimento para frente/trás (-180 a 180)
            // gamma: movimento para os lados (-90 a 90)
            const beta = event.beta ? event.beta : 0;
            const gamma = event.gamma ? event.gamma : 0;

            // Define os alvos de rotação baseados na inclinação
            targetX = (beta) * (Math.PI / 180);
            targetY = (gamma) * (Math.PI / 180);

            statusDiv.innerText = "Sensor ativo! Mova o celular.";
        }

        // Função universal para ativar o sensor
        function ativarSensor() {
            // Caso para iOS 13+ (Requer pedido de permissão explícito)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                statusDiv.innerText = "Solicitando permissão no iOS...";
                
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            btn.style.display = 'none';
                            statusDiv.innerText = "Permissão concedida!";
                        } else {
                            statusDiv.innerText = "Permissão negada pelo usuário.";
                        }
                    })
                    .catch(error => {
                        console.error(error);
                        statusDiv.innerText = "Erro no iOS: Faltou usar HTTPS ou interagir primeiro.";
                    });
            } else {
                // Caso para Android e navegadores desktop / iOS antigos
                statusDiv.innerText = "Tentando ativar no Android/Padrão...";
                
                // Adiciona o evento diretamente
                window.addEventListener('deviceorientation', handleOrientation, true);
                
                // Dispara um teste rápido para ver se o sensor realmente responde
                setTimeout(() => {
                    btn.style.display = 'none';
                    statusDiv.innerText = "Sensor ativado! Se não mover, verifique o HTTPS ou o giroscópio do aparelho.";
                }, 500);
            }
        }

        // Vincula a função ao clique do botão (obrigatório por segurança dos navegadores)
        btn.addEventListener('click', ativarSensor);
    </script>
</body>
</html>
