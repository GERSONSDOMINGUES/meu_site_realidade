<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Modelo 3D Interativo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #16161a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            pointer-events: auto;
        }
        #status {
            margin-top: 12px;
            color: #ffffff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }
    </style>
    <!-- Bibliotecas carregadas via unpkg (servidores de alta velocidade) -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="ui-container">
        <button id="btn-sensor">Ativar Sensor de Movimento</button>
        <div id="status">Iniciando motor 3D...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, meuModelo;
        let targetRotationX = 0, targetRotationY = 0;
        const lerpFactor = 0.08; 

        const btnSensor = document.getElementById('btn-sensor');
        const statusDiv = document.getElementById('status');

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0, 0, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Iluminação otimizada de estúdio
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const loader = new THREE.GLTFLoader();
            
            // ATENÇÃO: Adicionamos um número aleatório ao final do nome do arquivo (?v=...)
            // Isso força o GitHub e o seu celular a ignorarem o cache velho e carregarem instantaneamente.
            const antiCacheUrl = './modelo.glb?v=' + Math.random();

            loader.load(antiCacheUrl, 
                function (gltf) {
                    meuModelo = gltf.scene;
                    meuModelo.updateMatrixWorld();

                    const box = new THREE.Box3().setFromObject(meuModelo);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    meuModelo.position.sub(center);

                    const group = new THREE.Group();
                    group.add(meuModelo);
                    scene.add(group);
                    meuModelo = group;

                    // Ajuste de escala para objetos muito pequenos
                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0 && maxDim < 0.5) {
                        const scaleFactor = 1.2 / maxDim;
                        meuModelo.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    }

                    statusDiv.innerText = "Modelo carregado! Clique para ativar o sensor.";
                },
                function (xhr) {
                    statusDiv.innerText = "Carregando arquivo 3D...";
                },
                function (error) {
                    console.error(error);
                    statusDiv.innerHTML = "❌ Erro ao ler arquivo.<br>Verifique se o seu modelo está mesmo na raiz do GitHub.";
                }
            );

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (meuModelo) {
                meuModelo.rotation.x += (targetRotationX - meuModelo.rotation.x) * lerpFactor;
                meuModelo.rotation.y += (targetRotationY - meuModelo.rotation.y) * lerpFactor;
            }
            renderer.render(scene, camera);
        }

        function handleOrientation(event) {
            let x = event.beta; 
            let y = event.gamma;
            if (x > 90) x = 90;
            if (x < -90) x = -90;
            targetRotationX = (x * Math.PI / 180);
            targetRotationY = (y * Math.PI / 180);
        }

        function ativarSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btnSensor.style.display = 'none';
                            statusDiv.innerText = "Sensor ativo! Mova o celular.";
                        } else {
                            statusDiv.innerText = "Permissão negada.";
                        }
                    }).catch(() => { statusDiv.innerText = "Erro no sensor."; });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                btnSensor.style.display = 'none';
                statusDiv.innerText = "Sensor ativo! Mova o celular.";
            }
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        btnSensor.addEventListener('click', ativarSensor);
        init3D();
    </script>
</body>
</html>
