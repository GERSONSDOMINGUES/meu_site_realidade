<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Modelo 3D Interativo</title>
    <!-- Importa o componente de visualização 3D do Google -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #btn-permissao {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Botão necessário para iOS pedir permissão de usar os sensores -->
    <button id="btn-permissao">Ativar Movimento por Giroscópio</button>

    <!-- Tag que carrega o seu arquivo 3D -->
    <model-viewer id="modelo3d" 
                  src="seu-modelo.glb" 
                  alt="Meu modelo 3D" 
                  auto-rotate-delay="0"
                  camera-controls 
                  interaction-prompt="none"
                  shadow-intensity="1">
    </model-viewer>

    <script>
        const modelo = document.getElementById('modelo3d');
        const botao = document.getElementById('btn-permissao');

        function iniciarGiroscopio() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Necessário para iOS 13+
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', lidarComMovimento);
                            botao.style.display = 'none';
                        }
                    })
                    .catch(console.error);
            } else {
                // Android e navegadores mais antigos
                window.addEventListener('deviceorientation', lidarComMovimento);
                botao.style.display = 'none';
            }
        }

        function lidarComMovimento(event) {
            // Captura a rotação lateral (gamma) e frente/trás (beta) do celular
            const rotaçaoX = event.gamma ? event.gamma : 0; 
            const rotaçaoY = event.beta ? event.beta : 0;   

            // Mapeia e suaviza os valores para orbitar a câmera do modelo 3D
            // Ajuste os valores divisores (ex: 2 e 1.5) para aumentar ou diminuir a sensibilidade
            const grausX = rotaçaoX / 2;
            const grausY = (rotaçaoY - 60) / 1.5; 

            modelo.cameraOrbit = `${grausX}deg ${grausY}deg auto`;
        }

        botao.addEventListener('click', iniciarGiroscopio);
    </script>
</body>
</html>
