<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Modelo 3D Interativo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111111;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #ff2e44;
        }
        #status {
            margin-top: 10px;
            color: #ffffff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
    <!-- Importando Three.js e o carregador de GLTF (GLTFLoader) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-container">
        <button id="btn-sensor">Ativar Sensor de Movimento</button>
        <div id="status">Aguardando ativação...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, meuModelo;
        let targetRotationX = 0;
        let targetRotationY = 0;
        
        // Filtro de suavização (quanto menor, mais suave e lento o movimento)
        const lerpFactor = 0.08; 

        const btnSensor = document.getElementById('btn-sensor');
        const statusDiv = document.getElementById('status');

        // 1. Inicializar Cenário 3D
        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding; // Melhora as cores do modelo exportado
            container.appendChild(renderer.domElement);

            // Luzes (Essenciais para modelos importados não ficarem pretos)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Carregar o SEU modelo personalizado (.glb)
            const loader = new THREE.GLTFLoader();
            
            // Procura pelo arquivo 'modelo.glb' na mesma pasta do index.html
            loader.load('modelo.glb', 
                function (gltf) {
                    meuModelo = gltf.scene;
                    
                    // Centraliza o modelo automaticamente
                    const box = new THREE.Box3().setFromObject(meuModelo);
                    const center = box.getCenter(new THREE.Vector3());
                    meuModelo.position.sub(center);

                    // Grupo para facilitar rotações limpas
                    const group = new THREE.Group();
                    group.add(meuModelo);
                    scene.add(group);
                    meuModelo = group;

                    // AJUSTE DE ESCALA SE NECESSÁRIO:
                    // Se o modelo sumir ou ficar gigante, altere o valor abaixo (ex: 0.5 ou 2.0)
                    meuModelo.scale.set(1, 1, 1); 

                    statusDiv.innerText = "Modelo 3D carregado! Ative o sensor.";
                },
                function (xhr) {
                    statusDiv.innerText = `Carregando modelo: ${Math.round((xhr.loaded / xhr.total * 100))}%`;
                },
                function (error) {
                    console.error(error);
                    statusDiv.innerText = "Erro ao carregar modelo. Verifique se o arquivo 'modelo.glb' está no GitHub.";
                }
            );

            animate();
        }

        // 2. Loop de Renderização com Suavização (Lerp)
        function animate() {
            requestAnimationFrame(animate);

            if (meuModelo) {
                // Aplica a rotação de forma suavizada
                meuModelo.rotation.x += (targetRotationX - meuModelo.rotation.x) * lerpFactor;
                meuModelo.rotation.y += (targetRotationY - meuModelo.rotation.y) * lerpFactor;
            }

            renderer.render(scene, camera);
        }

        // 3. Processar Movimentos do Celular
        function handleOrientation(event) {
            // gamma: inclinação esquerda/direita (-90 a 90)
            // beta: inclinação frente/trás (-180 a 180)
            let x = event.beta; 
            let y = event.gamma;

            // Prevenir bugs se o celular virar de cabeça para baixo
            if (x > 90) x = 90;
            if (x < -90) x = -90;

            // Converte os graus em radianos de forma controlada para a rotação 3D
            targetRotationX = (x * Math.PI / 180);
            targetRotationY = (y * Math.PI / 180);
        }

        // 4. Gerenciar Permissões dos Sensores
        function ativarSensor() {
            // Caso seja iOS (Safari)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                statusDiv.innerText = "Solicitando permissão no iOS...";
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btnSensor.style.display = 'none';
                            statusDiv.innerText = "Sensor ativo! Mova o celular.";
                        } else {
                            statusDiv.innerText = "Permissão negada para o sensor.";
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        statusDiv.innerText = "Erro ao pedir permissão. Use HTTPS.";
                    });
            } 
            // Caso seja Android (Chrome/Firefox) ou navegadores sem bloqueio estrito
            else {
                window.addEventListener('deviceorientation', handleOrientation);
                btnSensor.style.display = 'none';
                statusDiv.innerText = "Sensor ativo! Mova o celular.";
            }
        }

        // Inicialização
        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        btnSensor.addEventListener('click', ativarSensor);
        
        // Inicia o cenário assim que a página abre
        init3D();
    </script>
</body>
</html>
