<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Modelo 3D Interativo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111111;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            pointer-events: auto;
        }
        #status {
            margin-top: 12px;
            color: #ffffff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }
    </style>
    
    <!-- Importando Three.js de uma CDN alternativa super estável (jsDelivr) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Importando o GLTFLoader correspondente e compatível da mesma CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-container">
        <button id="btn-sensor">Ativar Sensor de Movimento</button>
        <div id="status">Carregando componentes gráficos...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, meuModelo;
        let targetRotationX = 0, targetRotationY = 0;
        const lerpFactor = 0.08; 

        const btnSensor = document.getElementById('btn-sensor');
        const statusDiv = document.getElementById('status');

        function init3D() {
            try {
                // Validação imediata se os objetos da biblioteca estão presentes no navegador
                if (typeof THREE === 'undefined') {
                    statusDiv.innerText = "❌ Erro: Biblioteca Three.js falhou ao baixar.";
                    return;
                }
                if (typeof THREE.GLTFLoader === 'undefined') {
                    statusDiv.innerText = "❌ Erro: Extensão GLTFLoader não carregou.";
                    return;
                }

                statusDiv.innerText = "Construindo cenário 3D...";
                const container = document.getElementById('canvas-container');
                scene = new THREE.Scene();
                
                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
                camera.position.set(0, 0, 3);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.outputEncoding = THREE.sRGBEncoding;
                container.appendChild(renderer.domElement);

                // Luz ambiente e direcional forte para dar volume
                scene.add(new THREE.AmbientLight(0xffffff, 0.9));
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
                dirLight.position.set(5, 10, 7);
                scene.add(dirLight);

                statusDiv.innerText = "Conectando ao modelo.glb...";

                const loader = new THREE.GLTFLoader();
                // Adicionamos timestamp único para estourar o cache do navegador móvel
                const urlLimpa = './modelo.glb?cache=' + Date.now();

                loader.load(urlLimpa, 
                    function (gltf) {
                        meuModelo = gltf.scene;
                        meuModelo.updateMatrixWorld();

                        const box = new THREE.Box3().setFromObject(meuModelo);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        
                        meuModelo.position.sub(center);

                        const group = new THREE.Group();
                        group.add(meuModelo);
                        scene.add(group);
                        meuModelo = group;

                        // Ajustador automático para o modelo super leve de 4kb
                        const maxDim = Math.max(size.x, size.y, size.z);
                        if (maxDim > 0 && maxDim < 0.5) {
                            const scaleFactor = 1.2 / maxDim;
                            meuModelo.scale.set(scaleFactor, scaleFactor, scaleFactor);
                        }

                        statusDiv.innerText = "Modelo carregado! Ative o sensor.";
                    },
                    function (xhr) {
                        statusDiv.innerText = "Lendo arquivo 3D...";
                    },
                    function (error) {
                        console.error(error);
                        statusDiv.innerHTML = "❌ O arquivo modelo.glb não respondeu.<br>Confirme se ele está na raiz do repositório.";
                    }
                );

                animate();
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Falha crítica na renderização de tela.";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (meuModelo) {
                meuModelo.rotation.x += (targetRotationX - meuModelo.rotation.x) * lerpFactor;
                meuModelo.rotation.y += (targetRotationY - meuModelo.rotation.y) * lerpFactor;
            }
            renderer.render(scene, camera);
        }

        function handleOrientation(event) {
            let x = event.beta; 
            let y = event.gamma;
            if (x > 90) x = 90;
            if (x < -90) x = -90;
            targetRotationX = (x * Math.PI / 180);
            targetRotationY = (y * Math.PI / 180);
        }

        function ativarSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btnSensor.style.display = 'none';
                            statusDiv.innerText = "Sensor ativo! Mova o celular.";
                        } else {
                            statusDiv.innerText = "Permissão negada.";
                        }
                    }).catch(() => { statusDiv.innerText = "Erro ao validar sensor."; });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                btnSensor.style.display = 'none';
                statusDiv.innerText = "Sensor ativo! Mova o celular.";
            }
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        btnSensor.addEventListener('click', ativarSensor);
        window.addEventListener('load', init3D);
    </script>
</body>
</html>
