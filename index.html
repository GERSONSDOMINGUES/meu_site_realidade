<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemento 3D Interativo por Movimento</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #btn-permission {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.2s;
            z-index: 20;
        }
        #btn-permission:active {
            transform: scale(0.95);
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
    <!-- Carregando a biblioteca Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="info">
        <h2>Cubo 3D Controlado por Movimento</h2>
        <p>Incline o seu celular para rotacionar o objeto</p>
        <button id="btn-permission">Ativar Sensor de Movimento</button>
    </div>

    <script>
        // --- Configuração Básica do Three.js ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Criando o elemento 3D (um cubo estilizado)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshNormalMaterial();
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        camera.position.z = 5;

        // Variáveis para suavização do movimento (Filtro Passa-Baixa)
        let targetX = 0;
        let targetY = 0;

        // --- Animação / Render Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Suaviza a rotação aproximando a rotação atual da rotação alvo
            cube.rotation.x += (targetX - cube.rotation.x) * 0.1;
            cube.rotation.y += (targetY - cube.rotation.y) * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // Ajustar tamanho quando a tela mudar (ex: girar o celular)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Controle de Orientação / Giroscópio ---
        const btnPermission = document.getElementById('btn-permission');

        function handleOrientation(event) {
            // O DeviceOrientationEvent retorna valores em graus
            // Convertemos os ângulos (beta e gamma) em radianos para aplicar na rotação 3D
            const beta = event.beta;   // Movimento frente/trás (-180 a 180)
            const gamma = event.gamma; // Movimento esquerda/direita (-90 a 90)

            if (beta !== null && gamma !== null) {
                // Mapeia os graus para um limite de rotação em radianos
                targetX = (beta / 90) * Math.PI;
                targetY = (gamma / 90) * Math.PI;
            }
        }

        // Função para solicitar permissão (Obrigatório em dispositivos iOS)
        function requestMotionPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Dispositivos iOS 13+
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btnPermission.style.display = 'none';
                        } else {
                            alert('Permissão para acessar o giroscópio foi negada.');
                        }
                    })
                    .catch(console.error);
            } else {
                // Dispositivos Android e navegadores desktop que não exigem prompt
                window.addEventListener('deviceorientation', handleOrientation);
                btnPermission.style.display = 'none';
                
                // Alerta caso o usuário acesse do PC apenas para avisar
                if (!('ontouchstart' in window)) {
                    alert('Sensor de movimento não detectado. Use um celular para ver o efeito!');
                }
            }
        }

        // Evento do botão
        btnPermission.addEventListener('click', requestMotionPermission);
    </script>
</body>
</html>
