<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador 3D Interativo</title>
    <style>
        /* Força a cor escura mesmo se o JavaScript quebrar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111111 !important;
            font-family: -apple-system, system-ui, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            width: 85%;
            max-width: 320px;
            pointer-events: none;
        }
        button {
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            background-color: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,122,255,0.4);
            pointer-events: auto;
            width: 100%;
        }
        #status {
            margin-top: 15px;
            color: #ffffff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 16px;
            border-radius: 30px;
            display: inline-block;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
    
    <!-- Scripts robustos com espelhamento global via cdnjs sem restrição de origem -->
    <script src="https://cloudflare.com" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>

    <div id="ui-container">
        <button id="btn-sensor" onclick="ativarSensor()">Ativar Sensor de Movimento</button>
        <div id="status">Aguardando carregamento da página...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, meuModelo;
        let targetRotationX = 0, targetRotationY = 0;
        const lerpFactor = 0.05; // Movimento levemente mais suave para evitar tremores

        const btnSensor = document.getElementById('btn-sensor');
        const statusDiv = document.getElementById('status');

        function init3D() {
            try {
                statusDiv.innerText = "Criando ambiente tridimensional...";
                
                // Validação de segurança básica das importações do cabeçalho
                if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
                    statusDiv.innerHTML = "❌ Bibliotecas bloqueadas pelo navegador.<br>Tente abrir usando outra rede ou Wi-Fi.";
                    return;
                }

                const container = document.getElementById('canvas-container');
                scene = new THREE.Scene();
                
                camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 50);
                camera.position.set(0, 0, 2.5);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.outputEncoding = THREE.sRGBEncoding;
                container.appendChild(renderer.domElement);

                // Luz ambiente distribuída uniformemente
                scene.add(new THREE.AmbientLight(0xffffff, 0.9));
                
                // Luz direcional simulando iluminação solar para dar volume ao objeto
                const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
                sunLight.position.set(5, 8, 5);
                scene.add(sunLight);

                statusDiv.innerText = "Localizando arquivo modelo.glb...";

                const loader = new THREE.GLTFLoader();
                // O carimbo temporal (?t=) impede o celular de ler dados antigos e corrompidos em cache
                const pathModelo = "./modelo.glb?t=" + Date.now();

                loader.load(pathModelo, 
                    function (gltf) {
                        meuModelo = gltf.scene;
                        meuModelo.updateMatrixWorld();

                        // Enquadramento automático no centro da tela baseado na geometria do arquivo
                        const box = new THREE.Box3().setFromObject(meuModelo);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        
                        meuModelo.position.sub(center);

                        const pivotGroup = new THREE.Group();
                        pivotGroup.add(meuModelo);
                        scene.add(pivotGroup);
                        meuModelo = pivotGroup;

                        // Se o objeto de 4kb for muito pequeno, este bloco aumenta sua escala automaticamente
                        const maxDim = Math.max(size.x, size.y, size.z);
                        if (maxDim > 0 && maxDim < 0.6) {
                            const scaleFactor = 1.0 / maxDim;
                            meuModelo.scale.set(scaleFactor, scaleFactor, scaleFactor);
                        }

                        statusDiv.innerText = "Modelo 3D carregado! Ative o sensor.";
                    },
                    function (xhr) {
                        statusDiv.innerText = "Renderizando malha 3D...";
                    },
                    function (error) {
                        console.error(error);
                        statusDiv.innerHTML = "❌ Falha ao abrir o arquivo 'modelo.glb'.<br>Verifique se ele foi enviado para a pasta principal.";
                    }
                );

                animate();
            } catch (err) {
                statusDiv.innerText = "Erro ao processar placa de vídeo do celular.";
                console.error(err);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (meuModelo) {
                // Suavização matemática por interpolação linear (lerp)
                meuModelo.rotation.x += (targetRotationX - meuModelo.rotation.x) * lerpFactor;
                meuModelo.rotation.y += (targetRotationY - meuModelo.rotation.y) * lerpFactor;
            }
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function handleOrientation(event) {
            let x = event.beta;  // Inclinação para frente e para trás [-180, 180]
            let y = event.gamma; // Inclinação lateral esquerda e direita [-90, 90]

            if (x > 85) x = 85;
            if (x < -85) x = -85;

            // Transforma os eixos do giroscópio para a rotação nativa do elemento 3D
            targetRotationX = (x * Math.PI / 180);
            targetRotationY = (y * Math.PI / 180);
        }

        function ativarSensor() {
            // Rotina para iOS 13+ (Dispositivos Apple)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btnSensor.style.display = 'none';
                            statusDiv.innerText = "Sensor ativo! Incline o celular.";
                        } else {
                            statusDiv.innerText = "Acesso ao giroscópio rejeitado.";
                        }
                    }).catch(() => { statusDiv.innerText = "Erro ao configurar sensores."; });
            } 
            // Rotina para Android (Chrome/Firefox/Samsung Internet)
            else {
                window.addEventListener('deviceorientation', handleOrientation);
                btnSensor.style.display = 'none';
                statusDiv.innerText = "Sensor ativo! Incline o celular.";
            }
        }

        // Garante o redimensionamento elástico se o celular mudar a orientação (paisagem/retrato)
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Dispara o início logo após a montagem da árvore estrutural da página
        window.addEventListener('DOMContentLoaded', init3D);
    </script>
</body>
</html>
