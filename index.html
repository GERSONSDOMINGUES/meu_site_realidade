<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Modelo 3D Interativo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            pointer-events: auto;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }
        #status {
            margin-top: 12px;
            color: #ffffff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }
    </style>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-container">
        <button id="btn-sensor">Ativar Sensor de Movimento</button>
        <div id="status">Buscando modelo 3D...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, meuModelo;
        let targetRotationX = 0;
        let targetRotationY = 0;
        const lerpFactor = 0.08; 

        const btnSensor = document.getElementById('btn-sensor');
        const statusDiv = document.getElementById('status');

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0, 0, 3); // Câmera aproximada para objetos pequenos

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Iluminação Avançada (Estúdio em 3 Pontos para evitar silhuetas pretas)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight2.position.set(-5, -5, -5);
            scene.add(dirLight2);

            // Carregamento do arquivo .glb
            const loader = new THREE.GLTFLoader();
            loader.load('modelo.glb', 
                function (gltf) {
                    meuModelo = gltf.scene;
                    
                    // Força a atualização das matrizes do modelo do usuário
                    meuModelo.updateMatrixWorld();

                    // Centralização matemática rigorosa baseada na caixa delimitadora (Bounding Box)
                    const box = new THREE.Box3().setFromObject(meuModelo);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    meuModelo.position.sub(center);

                    const group = new THREE.Group();
                    group.add(meuModelo);
                    scene.add(group);
                    meuModelo = group;

                    // Ajuste Automático de Escala Dinâmica
                    // Se o modelo de 4KB for microscopicamente pequeno, o script o expande para caber na tela
                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0 && maxDim < 0.1) {
                        const scaleFactor = 1.0 / maxDim;
                        meuModelo.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    }

                    statusDiv.innerText = "Modelo pronto! Ative o sensor para girar.";
                },
                function (xhr) {
                    if (xhr.total > 0) {
                        statusDiv.innerText = `Carregando: ${Math.round((xhr.loaded / xhr.total * 100))}%`;
                    } else {
                        statusDiv.innerText = "Carregando modelo...";
                    }
                },
                function (error) {
                    console.error(error);
                    statusDiv.innerText = "Erro: certifique-se de que o arquivo chama-se 'modelo.glb' no GitHub.";
                }
            );

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (meuModelo) {
                meuModelo.rotation.x += (targetRotationX - meuModelo.rotation.x) * lerpFactor;
                meuModelo.rotation.y += (targetRotationY - meuModelo.rotation.y) * lerpFactor;
            }
            renderer.render(scene, camera);
        }

        function handleOrientation(event) {
            let x = event.beta; 
            let y = event.gamma;

            if (x > 90) x = 90;
            if (x < -90) x = -90;

            // Sensibilidade ajustada para visualização confortável ao inclinar
            targetRotationX = (x * Math.PI / 180);
            targetRotationY = (y * Math.PI / 180);
        }

        function ativarSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btnSensor.style.display = 'none';
                            statusDiv.innerText = "Sensor ativo! Mova o celular.";
                        } else {
                            statusDiv.innerText = "Permissão ao sensor negada.";
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        statusDiv.innerText = "Erro de permissão. Teste usando HTTPS.";
                    });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                btnSensor.style.display = 'none';
                statusDiv.innerText = "Sensor ativo! Mova o celular.";
            }
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        btnSensor.addEventListener('click', ativarSensor);
        init3D();
    </script>
</body>
</html>
