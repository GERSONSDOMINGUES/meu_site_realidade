<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Modelo 3D Interativo</title>
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #2c2c2c 0%, #121212 100%);
            font-family: sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #btn-permissao {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: #ffffff;
            color: #121212;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }
    </style>
</head>
<body>

    <button id="btn-permissao">Ativar Movimento por Giroscópio</button>

    <model-viewer id="modelo3d" 
                  src="modelo.glb" 
                  alt="Meu modelo 3D Interativo" 
                  camera-controls 
                  touch-action="none"
                  shadow-intensity="1.5"
                  environment-image="neutral"
                  exposure="1">
    </model-viewer>

    <script>
        const modelo = document.getElementById('modelo3d');
        const botao = document.getElementById('btn-permissao');

        function iniciarGiroscopio() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', lidarComMovimento);
                            botao.style.display = 'none';
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', lidarComMovimento);
                botao.style.display = 'none';
            }
        }

        function lidarComMovimento(event) {
            const rX = event.gamma ? event.gamma : 0; 
            const rY = event.beta ? event.beta : 0;   
            const grausX = rX * 0.8;
            const grausY = (rY - 60) * 0.8; 
            modelo.cameraOrbit = `${grausX}deg ${grausY}deg auto`;
        }

        botao.addEventListener('click', iniciarGiroscopio);
    </script>
</body>
</html>
